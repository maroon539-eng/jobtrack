
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JobTrack | 취업 준비 관리</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6fa;
      margin: 0;
      padding: 40px;
      color: #222;
    }
    .container {
      max-width: 900px;
      margin: auto;
    }
    .card {
      background: white;
      padding: 24px;
      margin: 16px 0;
      border-radius: 12px;
      box-shadow: 0 2px 8px #00000010;
    }
    h1 { color: #2563eb; }
  </style>
</head>
<body>
  <div class="container">
    <h1>JobTrack</h1>
    <p>나만의 취업 준비 관리 대시보드</p>

    <div class="card">
      <h2>채용공고 관리</h2>
      <p>관심 기업의 채용공고와 마감일을 관리합니다.</p>
    </div>

    <div class="card">
      <h2>자기소개서 관리</h2>
      <p>회사별 자기소개서를 정리하고 관리합니다.</p>
    </div>

    <div class="card">
      <h2>지원 현황</h2>
      <p>서류, 면접, 최종 결과를 관리합니다.</p>
    </div>
  </div>
</body>
</html>
